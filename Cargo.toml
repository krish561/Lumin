[package]
name = "lumin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
ratatui = "0.30.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
async-channel = "2"

[[bin]]
name = "lumin-overlay"
path = "src/bin/lumin-overlay.rs"
